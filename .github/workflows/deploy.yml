name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Install cloudflared
      # --------------------------------------------------
      - name: Install cloudflared
        run: |
          curl -L \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      # --------------------------------------------------
      # 2. Configure SSH
      # --------------------------------------------------
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$DEPLOY_SSH_KEY_B64" \
            | base64 --decode \
            > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          cat > ~/.ssh/config << EOF
          Host maintenance-server
              HostName ${{ secrets.DEPLOY_HOST }}
              User ${{ secrets.DEPLOY_USER }}
              IdentityFile ~/.ssh/deploy_key
              IdentitiesOnly yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ConnectTimeout 15
              ServerAliveInterval 30
              ServerAliveCountMax 3
              ProxyCommand env CLOUDFLARE_ACCESS_CLIENT_ID="$CLOUDFLARE_ACCESS_CLIENT_ID" CLOUDFLARE_ACCESS_CLIENT_SECRET="$CLOUDFLARE_ACCESS_CLIENT_SECRET" cloudflared access ssh --hostname %h
          EOF

          chmod 600 ~/.ssh/config

          echo "SSH configuration created."

      # --------------------------------------------------
      # 3. Test SSH
      # --------------------------------------------------
      - name: Test SSH connection
        run: |
          ssh -vvv maintenance-server \
            "echo 'SSH connection successful'"

      # --------------------------------------------------
      # 4. Create production .env
      # --------------------------------------------------
      - name: Create production .env
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_NAME: ${{ secrets.ADMIN_USER_NAME }}
          PORT: ${{ secrets.PORT }}
        run: |
          ssh maintenance-server \
            "cp /opt/maintenance-bot/.env.example /opt/maintenance-bot/.env"

          ssh maintenance-server \
            "sed -i 's|^BOT_TOKEN=.*|BOT_TOKEN=$BOT_TOKEN|' /opt/maintenance-bot/.env"

          ssh maintenance-server \
            "sed -i 's|^ADMIN_USER_NAME=.*|ADMIN_USER_NAME=$ADMIN_USER_NAME|' /opt/maintenance-bot/.env"

          ssh maintenance-server \
            "sed -i 's|^PORT=.*|PORT=$PORT|' /opt/maintenance-bot/.env"

          ssh maintenance-server \
            "chmod 600 /opt/maintenance-bot/.env"

      # --------------------------------------------------
      # 5. Deploy
      # --------------------------------------------------
      - name: Deploy
        run: |
          ssh maintenance-server << 'EOF'
            set -e

            cd /opt/maintenance-bot

            echo "========================================"
            echo "Pulling latest code..."
            echo "========================================"

            git pull origin master

            echo "========================================"
            echo "Checking Docker Compose configuration..."
            echo "========================================"

            docker compose config > /dev/null

            echo "========================================"
            echo "Building Docker image..."
            echo "========================================"

            docker compose build --pull

            echo "========================================"
            echo "Starting bot..."
            echo "========================================"

            docker compose up -d

            echo "========================================"
            echo "Removing unused Docker images..."
            echo "========================================"

            docker image prune -f

            echo "========================================"
            echo "Deployment status:"
            echo "========================================"

            docker compose ps

            echo "========================================"
            echo "Bot logs:"
            echo "========================================"

            docker compose logs --tail=50 bot

            echo "========================================"
            echo "Deployment complete."
            echo "========================================"
          EOF